{% set name = "substrait" %}
{% set version = "0.35.0" %}

package:
  name: python-{{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/substrait-{{ version }}.tar.gz
  sha256: c919779a66e8bd2b8747b86b23c11c30ce58438635e7d132e2179e8454148ce3

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools >=61
    - setuptools_scm >=6.2
  run:
    - protobuf <7,>=5
    - python >={{ python_min }}
    - python-substrait-extensions ==0.100.0
    - python-substrait-protobuf ==0.100.0
    # - sqloxide 
    # - pyyaml 
    # - python-substrait-antlr ==0.99.0
    # - deepdiff 
    # - sqloxide 
    # - pyyaml 
    # - python-substrait-antlr ==0.99.0
    # - deepdiff 
    # - sqloxide 
    # - pyyaml 
    # - python-substrait-antlr ==0.99.0
    # - deepdiff 
    # - sqloxide 
    # - pyyaml 
    # - python-substrait-antlr ==0.99.0
    # - deepdiff 
    # - sqloxide 
    # - pyyaml 
    # - python-substrait-antlr ==0.100.0
    # - deepdiff 

test:
  imports:
    - substrait
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/substrait/
  summary: A python package for Substrait.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - yongchul
    - westonpace
    - vbarua
    - jacques-n
    - epsilonprime
    - benbellick
    - nielspardon
    - gforsyth
