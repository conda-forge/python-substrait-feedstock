{% set name = "substrait" %}
{% set version = "0.30.0" %}

package:
  name: python-{{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/substrait-{{ version }}.tar.gz
  sha256: 3ec97768ef5685fc47e89e0b5f152282a01594086e70586f48efcd6ac5bd6567

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools >=61
    - setuptools_scm >=6.2
  run:
    - protobuf >=5,<7
    - python >={{ python_min }}
    - python-substrait-extensions ==0.99.0
    - python-substrait-protobuf ==0.99.0

test:
  imports:
    - substrait
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/substrait/
  summary: A python package for Substrait.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - yongchul
    - westonpace
    - vbarua
    - jacques-n
    - epsilonprime
    - benbellick
    - nielspardon
    - gforsyth
